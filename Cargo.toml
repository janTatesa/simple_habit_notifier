[package]
name = "shn"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["cargo", "derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
color-eyre = "0.6.5"
dirs = "7.0.0"
jiff = { version = "0.2.39", features = ["serde"] }
notify-rust = "4.18.2"
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
